<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手</title>

    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <script src="https://unpkg.com/element-plus"></script>
    <!-- Element Plus Icons -->
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!-- Marked for Markdown -->
    <script src="https://unpkg.com/marked/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            min-height: calc(100vh - 180px);
        }

        /* 侧边栏 */
        .sidebar {
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            color: white;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item.active {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .menu-icon {
            font-size: 20px;
        }

        /* 内容区域 */
        .content {
            padding: 30px;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 聊天界面 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 240px);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
        }

        /* SQL 优化界面 */
        .sql-editor-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
            height: calc(100vh - 240px);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-size: 20px;
            font-weight: 600;
            color: #303133;
        }

        .sql-editors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        .sql-panel {
            display: flex;
            flex-direction: column;
            border: 2px solid #e4e7ed;
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            background: #f5f7fa;
            border-bottom: 2px solid #e4e7ed;
            font-weight: 600;
            color: #606266;
        }

        .sql-textarea {
            flex: 1;
            padding: 16px;
            border: none;
            resize: none;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
        }

        .sql-textarea:focus {
            background: #fafafa;
        }

        .optimized-sql {
            flex: 1;
            padding: 16px;
            background: #f0f9ff;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* 代码生成界面 */
        .code-gen-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: calc(100vh - 240px);
        }

        .gen-input-section {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 12px;
        }

        .gen-result-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #e4e7ed;
            border-radius: 12px;
            overflow: hidden;
        }

        .code-output {
            flex: 1;
            padding: 20px;
            background: #282c34;
            color: #abb2bf;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Markdown 样式 */
        .markdown-body {
            line-height: 1.6;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .markdown-body code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .markdown-body pre {
            background: #282c34;
            color: #abb2bf;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .sql-editors {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 头部 -->
    <div class="header">
        <h1>🤖 AI 智能助手</h1>
        <p>聊天对话 · SQL优化 · 代码生成</p>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-title">功能菜单</div>

            <div
                    class="menu-item"
                    :class="{ active: activeTab === 'chat' }"
                    @click="activeTab = 'chat'"
            >
                <span class="menu-icon">💬</span>
                <span>智能对话</span>
            </div>

            <div
                    class="menu-item"
                    :class="{ active: activeTab === 'sql' }"
                    @click="activeTab = 'sql'"
            >
                <span class="menu-icon">🗄️</span>
                <span>SQL优化</span>
            </div>

            <div
                    class="menu-item"
                    :class="{ active: activeTab === 'code' }"
                    @click="activeTab = 'code'"
            >
                <span class="menu-icon">💻</span>
                <span>代码生成</span>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 智能对话 -->
            <div v-show="activeTab === 'chat'" class="tab-content active">
                <div class="chat-container">
                    <div class="chat-messages" ref="chatMessages">
                        <div
                                v-for="(msg, index) in chatHistory"
                                :key="index"
                                class="message"
                                :class="msg.role"
                        >
                            <div class="message-avatar">
                                {{ msg.role === 'user' ? '👤' : '🤖' }}
                            </div>
                            <div>
                                <div class="message-content">
                                    <div v-if="msg.role === 'ai'" v-html="renderMarkdown(msg.content)"></div>
                                    <div v-else>{{ msg.content }}</div>
                                </div>
                                <div class="message-time">{{ msg.time }}</div>
                            </div>
                        </div>

                        <!-- 加载状态 -->
                        <div v-if="chatLoading" class="message ai">
                            <div class="message-avatar">🤖</div>
                            <div class="message-content">
                                <el-icon class="is-loading">
                                    <Loading/>
                                </el-icon>
                                <span style="margin-left: 8px;">思考中...</span>
                            </div>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <el-input
                                v-model="chatInput"
                                type="textarea"
                                :rows="3"
                                placeholder="输入您的问题..."
                                class="chat-input"
                                @keyup.enter.ctrl="sendChatMessage"
                        ></el-input>
                        <el-button
                                type="primary"
                                size="large"
                                @click="sendChatMessage"
                                :loading="chatLoading"
                                :disabled="!chatInput.trim()"
                        >
                            <el-icon>
                                <Promotion/>
                            </el-icon>
                            发送
                        </el-button>
                    </div>
                </div>
            </div>

            <!-- SQL优化 -->
            <div v-show="activeTab === 'sql'" class="tab-content">
                <div class="sql-editor-container">
                    <div class="editor-header">
                        <div class="editor-title">🗄️ SQL 优化助手</div>
                        <el-button
                                type="primary"
                                @click="optimizeSql"
                                :loading="sqlLoading"
                                :disabled="!originalSql.trim()"
                        >
                            <el-icon>
                                <MagicStick/>
                            </el-icon>
                            优化SQL
                        </el-button>
                    </div>

                    <div class="sql-editors">
                        <div class="sql-panel">
                            <div class="panel-header">原始 SQL</div>
                            <textarea
                                    v-model="originalSql"
                                    class="sql-textarea"
                                    placeholder="请输入需要优化的SQL语句..."
                            ></textarea>
                        </div>

                        <div class="sql-panel">
                            <div class="panel-header">优化后的 SQL</div>
                            <div class="optimized-sql" v-if="optimizedSql">
                                {{ optimizedSql }}
                            </div>
                            <div class="optimized-sql" v-else style="color: #999;">
                                优化结果将显示在这里...
                            </div>
                        </div>
                    </div>

                    <el-alert
                            v-if="sqlTip"
                            :title="sqlTip"
                            type="info"
                            :closable="false"
                            show-icon
                    ></el-alert>
                </div>
            </div>

            <!-- 代码生成 -->
            <div v-show="activeTab === 'code'" class="tab-content">
                <div class="code-gen-container">
                    <div class="gen-input-section">
                        <el-input
                                v-model="codeRequest"
                                type="textarea"
                                :rows="4"
                                placeholder="描述您需要生成的代码，例如：创建一个用户管理的Spring Boot Controller，包含增删改查接口..."
                        ></el-input>
                        <div style="margin-top: 12px; display: flex; gap: 12px;">
                            <el-button
                                    type="primary"
                                    @click="generateCode"
                                    :loading="codeLoading"
                                    :disabled="!codeRequest.trim()"
                            >
                                <el-icon>
                                    <Cpu/>
                                </el-icon>
                                生成代码
                            </el-button>
                            <el-button @click="clearCodeResult">
                                <el-icon>
                                    <Delete/>
                                </el-icon>
                                清空
                            </el-button>
                        </div>
                    </div>

                    <div class="gen-result-section">
                        <div class="panel-header">
                            生成的代码
                            <el-button
                                    v-if="generatedCode"
                                    size="small"
                                    style="float: right;"
                                    @click="copyCode"
                            >
                                <el-icon>
                                    <CopyDocument/>
                                </el-icon>
                                复制
                            </el-button>
                        </div>
                        <div class="code-output" v-if="generatedCode">
                            {{ generatedCode }}
                        </div>
                        <div class="code-output" v-else
                             style="color: #666; display: flex; align-items: center; justify-content: center;">
                            代码生成结果将显示在这里...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const {createApp, ref, reactive, nextTick} = Vue;
    const {ElMessage} = ElementPlus;

    const app = createApp({
        setup() {
            // API基础URL
            const API_BASE = 'http://localhost:8091/ai';

            // 当前激活的标签页
            const activeTab = ref('chat');

            // ========== 智能对话 ==========
            const chatInput = ref('');
            const chatLoading = ref(false);
            const chatHistory = reactive([]);
            const chatMessages = ref(null);

            // 发送聊天消息
            const sendChatMessage = async () => {
                if (!chatInput.value.trim()) {
                    ElMessage.warning('请输入问题');
                    return;
                }

                const userMessage = chatInput.value.trim();

                // 添加用户消息
                chatHistory.push({
                    role: 'user',
                    content: userMessage,
                    time: formatTime(new Date())
                });

                chatInput.value = '';
                chatLoading.value = true;

                // 滚动到底部
                await nextTick();
                scrollToBottom();

                try {
                    const response = await axios.get(`${API_BASE}/chat`, {
                        params: {msg: userMessage}
                    });

                    // 添加AI回复
                    chatHistory.push({
                        role: 'ai',
                        content: response.data,
                        time: formatTime(new Date())
                    });

                    await nextTick();
                    scrollToBottom();
                } catch (error) {
                    ElMessage.error('请求失败: ' + (error.response?.data?.message || error.message));
                } finally {
                    chatLoading.value = false;
                }
            };

            // 滚动到底部
            const scrollToBottom = () => {
                if (chatMessages.value) {
                    chatMessages.value.scrollTop = chatMessages.value.scrollHeight;
                }
            };

            // 渲染Markdown
            const renderMarkdown = (text) => {
                if (!text) return '';
                return marked.parse(text);
            };

            // ========== SQL优化 ==========
            const originalSql = ref('');
            const optimizedSql = ref('');
            const sqlLoading = ref(false);
            const sqlTip = ref('');

            // 优化SQL
            const optimizeSql = async () => {
                if (!originalSql.value.trim()) {
                    ElMessage.warning('请输入SQL语句');
                    return;
                }

                sqlLoading.value = true;
                optimizedSql.value = '';
                sqlTip.value = '';

                try {
                    const response = await axios.get(`${API_BASE}/sql/optimize`, {
                        params: {sql: originalSql.value}
                    });

                    optimizedSql.value = response.data;

                    if (response.data.includes('请使用')) {
                        sqlTip.value = '提示：建议使用 /smart-sql/optimize 接口进行更专业的SQL优化';
                    } else {
                        ElMessage.success('SQL优化完成');
                    }
                } catch (error) {
                    ElMessage.error('优化失败: ' + (error.response?.data?.message || error.message));
                } finally {
                    sqlLoading.value = false;
                }
            };

            // ========== 代码生成 ==========
            const codeRequest = ref('');
            const generatedCode = ref('');
            const codeLoading = ref(false);

            // 生成代码
            const generateCode = async () => {
                if (!codeRequest.value.trim()) {
                    ElMessage.warning('请输入代码需求');
                    return;
                }

                codeLoading.value = true;
                generatedCode.value = '';

                try {
                    const response = await axios.get(`${API_BASE}/code/gen`, {
                        params: {req: codeRequest.value}
                    });

                    generatedCode.value = response.data;
                    ElMessage.success('代码生成完成');
                } catch (error) {
                    ElMessage.error('生成失败: ' + (error.response?.data?.message || error.message));
                } finally {
                    codeLoading.value = false;
                }
            };

            // 清空代码结果
            const clearCodeResult = () => {
                codeRequest.value = '';
                generatedCode.value = '';
            };

            // 复制代码
            const copyCode = async () => {
                if (!generatedCode.value) {
                    ElMessage.warning('没有可复制的代码');
                    return;
                }

                try {
                    await navigator.clipboard.writeText(generatedCode.value);
                    ElMessage.success('代码已复制到剪贴板');
                } catch (error) {
                    ElMessage.error('复制失败，请手动复制');
                }
            };

            // 格式化时间
            const formatTime = (date) => {
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            };

            return {
                activeTab,
                // Chat
                chatInput,
                chatLoading,
                chatHistory,
                chatMessages,
                sendChatMessage,
                renderMarkdown,
                // SQL
                originalSql,
                optimizedSql,
                sqlLoading,
                sqlTip,
                optimizeSql,
                // Code
                codeRequest,
                generatedCode,
                codeLoading,
                generateCode,
                clearCodeResult,
                copyCode
            };
        }
    });

    // 注册图标
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component);
    }

    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
