# springdoc-openapi项目配置
springdoc:
  pre-loading-enabled: false
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'ALL'
      display-name: '全部'
      paths-to-match: '/**'
      packages-to-scan: com.chance.controller
    - group: 'COURSE'
      display-name: '课程'
      paths-to-match: '/**'
      packages-to-scan: com.chance.controller.course
    - group: 'FILE'
      display-name: '文件'
      paths-to-match: '/**'
      packages-to-scan: com.chance.controller.file
    - group: 'TEST'
      display-name: '测试'
      paths-to-match: '/**'
      packages-to-scan: com.chance.controller.test
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true # 是否显示界面中"文档管理"功能
    swagger-model-name: 实体类列表
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false # 是否启用Host
    enable-home-custom: false
    home-custom-path: classpath:file/*
    enable-search: false # 是否禁用Ui界面中的搜索框
    enable-footer: false # 是否显示Footer
    #    enable-footer-custom: true # 是否自定义Footer
    #    footer-custom-content: Apache License 2.0 | Copyright  2024-[chance](https://github.com/Chance-Wu/)
    enable-dynamic-parameter: false
    enable-debug: true
    enable-open-api: true # 显示OpenAPI规范
    enable-group: true # 是否开启分组
  cors: false # 是否开启一个默认的 跨域配置,该功能配合自定义Host使用
  production: false # 是否开启生产环境保护策略
  basic:
    enable: false # 是否开启基础认证
    username: chance
    password: 539976
  documents:
    - group: 1
      name: 测试自定义标题分组
      # 某一个文件夹下所有的.md文件
      locations: classpath:markdown/druid/*
    - group: 2
      name: 接口签名
      # 某一个文件夹下单个.md文件
      locations: classpath:markdown/mybatis/*

